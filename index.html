<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="div-main">
        <h1 class="heading-one">Rock Paper Scissor</h1>
        <!-- <button class="button-one rock">Rock</button>
        <button class="button-two paper">Paper</button>
        <button class="button-three scissor">Scissor</button> -->
        <div class="div-second">
            <p class="paragraph-one">✊</p>
            <p class="paragraph">vs</p>
            <p class="heading-two">🤖</p>
        </div>
        <p class="paragraph-two"></p>
        <p class="paragraph-three"></p>
        <div class="div-button">
            <p class="paragraph-four">Choose your move</p>
            <div class="div-button-two">
                <button class="button-one rock rock-one">✊</button>
                <button class="button-two paper rock-one">✋</button>
                <button class="button-three scissor rock-one">✌️</button>
            </div>

        <div class="div-one">
            <div class="human-score">
                <p class="paragraph-five">0</p>
                <p class="paragraph-six">YOU</p>
            </div>
            <div class="bot-score">
            <p class="paragraph-seven">0</p>
            <p class="paragraph-eight">BOT</p>
            </div>
        </div>
        <button class="button-four">Reset</button>
    </div>
